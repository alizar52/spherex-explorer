<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="Archivo, Helvetica, Arial, sans-serif">
  <rect width="920" height="500" fill="#1E2326"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#E5A03A"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="590" height="460" fill="#262C30" stroke="#56626A" stroke-width="1.5"/>
  <text x="40" y="52" fill="#DCE2E4" font-size="19" font-weight="700">SPHEREx images (FITS files)</text>
  <text x="40" y="74" fill="#939DA2" font-size="13.5">In NASA's IRSA archive. Whole sky every six months, 102 infrared colours.</text>
  <text x="40" y="92" fill="#939DA2" font-size="13.5">Each file: image, quality flags, noise, zodiacal light, wavelength map.</text>

  <rect x="40" y="112" width="550" height="348" fill="#2E353A" stroke="#56626A"/>
  <text x="60" y="140" fill="#DCE2E4" font-size="16" font-weight="700">Pipeline</text>
  <text x="60" y="158" fill="#939DA2" font-size="12.5">Python, astropy</text>
  <g fill="#C3CBCE" font-size="13">
    <text x="60" y="190">1  Find every image of a position</text>
    <text x="60" y="214">2  Cut out a small square</text>
    <text x="60" y="238">3  Turn north up, same grid</text>
    <text x="60" y="262">4  Mask flagged pixels</text>
    <text x="60" y="286">5  Remove zodiacal light</text>
    <text x="60" y="310">6  Measure brightness</text>
    <text x="60" y="334">7  Find what moved or changed</text>
  </g>

  <rect x="300" y="176" width="270" height="264" fill="#1E2326" stroke="#56626A"/>
  <text x="318" y="204" fill="#DCE2E4" font-size="16" font-weight="700">One JSON file per object</text>
  <text x="318" y="224" fill="#939DA2" font-size="12.5">frames, measurements, changes found</text>

  <rect x="318" y="246" width="234" height="176" fill="#E3EAEC"/>
  <text x="336" y="276" fill="#10171A" font-size="16" font-weight="700">Website</text>
  <text x="336" y="296" fill="#4D5A60" font-size="12.5">HTML and JavaScript</text>
  <g fill="#10171A" font-size="13">
    <text x="336" y="326">Plays the frames</text>
    <text x="336" y="348">Compares two dates</text>
    <text x="336" y="370">Shows charts</text>
    <text x="336" y="392">Explains with guides</text>
  </g>
  <circle cx="520" cy="280" r="6" fill="#10171A"/>
  <circle cx="534" cy="268" r="3" fill="#E5A03A"/>

  <text x="650" y="52" fill="#DCE2E4" font-size="16" font-weight="700">Plugs in without</text>
  <text x="650" y="72" fill="#DCE2E4" font-size="16" font-weight="700">changing the rest</text>

  <g font-size="13">
    <text x="650" y="122" fill="#DCE2E4" font-weight="600">New SPHEREx releases</text>
    <text x="650" y="140" fill="#939DA2">rerun the pipeline</text>
    <path d="M644 128 H 614" stroke="#E5A03A" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

    <text x="650" y="192" fill="#DCE2E4" font-weight="600">Live search, any position</text>
    <text x="650" y="210" fill="#939DA2">server runs the same pipeline</text>
    <path d="M644 198 H 594" stroke="#E5A03A" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

    <text x="650" y="262" fill="#DCE2E4" font-weight="600">Machine-learning model</text>
    <text x="650" y="280" fill="#939DA2">adds its own changes found</text>
    <path d="M644 268 H 580" stroke="#E5A03A" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

    <text x="650" y="332" fill="#DCE2E4" font-weight="600">Other telescopes</text>
    <text x="650" y="350" fill="#939DA2">Gaia and WISE catalogues on top</text>
    <path d="M644 338 H 580" stroke="#E5A03A" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

    <text x="650" y="402" fill="#DCE2E4" font-weight="600">Another app or website</text>
    <text x="650" y="420" fill="#939DA2">reads the same JSON files</text>
    <path d="M644 408 H 580" stroke="#E5A03A" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  </g>
</svg>
